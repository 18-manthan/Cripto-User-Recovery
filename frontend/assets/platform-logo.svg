<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Investor Intelligence Platform">
  <defs>
    <linearGradient id="bg" x1="8" y1="6" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#152238"/>
    </linearGradient>
    <linearGradient id="ring" x1="18" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#14F195"/>
    </linearGradient>
    <linearGradient id="slice-a" x1="32" y1="18" x2="48" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0EA5C9"/>
    </linearGradient>
    <linearGradient id="slice-b" x1="20" y1="28" x2="36" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14F195"/>
      <stop offset="1" stop-color="#0D9B6E"/>
    </linearGradient>
    <linearGradient id="slice-c" x1="28" y1="34" x2="44" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="rgba(34,211,238,0.28)" stroke-width="1.5"/>
  <!-- allocation pie -->
  <g transform="translate(32 33)" filter="url(#glow)">
    <path d="M0-15 A15 15 0 0 1 12.99 7.5 L0 0 Z" fill="url(#slice-a)"/>
    <path d="M12.99 7.5 A15 15 0 0 1-4.5 14.2 L0 0 Z" fill="url(#slice-b)"/>
    <path d="M-4.5 14.2 A15 15 0 1 1 0-15 L0 0 Z" fill="url(#slice-c)" opacity="0.92"/>
    <circle r="5.5" fill="#0B1220" stroke="url(#ring)" stroke-width="1.5"/>
  </g>
  <!-- performance trend -->
  <path d="M14 44 L22 38 L30 41 L38 30 L46 34 L50 28" stroke="url(#ring)" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>
  <circle cx="50" cy="28" r="2.5" fill="#14F195"/>
</svg>
